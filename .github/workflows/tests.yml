name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"

      - name: Instalar dependencias
        run: uv sync --all-groups

      - name: Ejecutar tests
        run: uv run pytest
