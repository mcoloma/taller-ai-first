name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ".tool-versions"

      - name: Instalar dependencias
        run: uv sync --all-groups

      - name: Ejecutar tests
        run: uv run pytest
